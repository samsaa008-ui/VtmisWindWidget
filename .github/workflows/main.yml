name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project structure
        run: |
          mkdir -p app/src/main/java/bg/travelgin/vtmiswind
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml

          cp MainActivity.kt app/src/main/java/bg/travelgin/vtmiswind/
          cp VtmisScraper.kt app/src/main/java/bg/travelgin/vtmiswind/
          cp WindReading.kt app/src/main/java/bg/travelgin/vtmiswind/
          cp WindRepository.kt app/src/main/java/bg/travelgin/vtmiswind/
          cp WindUpdateWorker.kt app/src/main/java/bg/travelgin/vtmiswind/
          cp WindWidgetProvider.kt app/src/main/java/bg/travelgin/vtmiswind/

          cp activity_main.xml app/src/main/res/layout/
          cp widget_wind.xml app/src/main/res/layout/
          cp wind_widget_info.xml app/src/main/res/xml/
          cp widget_background_premium.xml app/src/main/res/drawable/
          cp compass_circle.xml app/src/main/res/drawable/
          cp ic_direction_arrow.xml app/src/main/res/drawable/
          cp ic_wind.xml app/src/main/res/drawable/
          cp ic_gust.xml app/src/main/res/drawable/
          cp ic_windsock.xml app/src/main/res/drawable/
          cp ic_lighthouse.xml app/src/main/res/drawable/


          cp strings.xml app/src/main/res/values/
          cp themes.xml app/src/main/res/values/
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VtmisWindWidget"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "bg.travelgin.vtmiswind"
              compileSdk = 35

              defaultConfig {
                  applicationId = "bg.travelgin.vtmiswind"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  viewBinding = true
              }
              compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
              implementation("androidx.work:work-runtime-ktx:2.10.0")
              implementation("org.jsoup:jsoup:1.18.3")
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VtmisWindWidget-APK
          path: app/build/outputs/apk/debug/app-debug.apk
